name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: VERSION is valid (and matches the tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION
        env:
          REF_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION '$v' is not X.Y.Z"; exit 1; }
          if [ -n "$REF_TAG" ] && [ "$REF_TAG" != "v$v" ]; then echo "Tag $REF_TAG does not match VERSION $v"; exit 1; fi

  web:
    name: Web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the page is one self-contained file
        run: |
          test -s web/gravitated.html
          ! grep -E '<script[^>]+src=|<link[^>]+href=' web/gravitated.html
      - run: cp web/gravitated.html "$RUNNER_TEMP/gravitated.html"
      - uses: actions/upload-artifact@v4
        with:
          name: gravitated-html
          path: ${{ runner.temp }}/gravitated.html
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (Gradle bundles web/gravitated.html)
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: Android
      - run: cp Android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/gravitated-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gravitated-apk
          path: ${{ runner.temp }}/gravitated-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/gravitated.html "gravitated-$TAG.html"
          mv artifacts/gravitated-debug.apk "gravitated-$TAG-debug.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Gravitated $TAG" --generate-notes \
            "gravitated-$TAG.html#Gravitated (single HTML file)" \
            "gravitated-$TAG-debug.apk#Gravitated (Android debug APK)"
